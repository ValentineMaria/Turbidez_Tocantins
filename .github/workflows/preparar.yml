name: Preparar (uma vez)

# Rode uma vez antes da primeira atualização, e de novo só se mudar o modelo ou os critérios.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar trechos, máscara de água e modelo (Earth Engine)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ vars.GEE_PROJECT }}
        run: python pipeline/preparar.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/estatico site/data/trechos.geojson
          git diff --cached --quiet || git commit -m "Preparação: trechos, telhas com água e bacias"
          git push
